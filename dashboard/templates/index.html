<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Sentiment Dashboard</title>
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        h2 {
            margin-bottom: 5px;
            color: #222;
        }

        #statusText {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .chart-container {
            position: relative;
            height: 320px;
            width: 100%;
        }

        .btn-fetch {
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-fetch:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Market Sentiment Distribution</h2>
        <div id="statusText">Fetching dynamic news data from API...</div>

        <div class="chart-container">
            <canvas id="marketSentimentChart"></canvas>
        </div>

        <button class="btn-fetch" onclick="fetchSentimentData()">Refresh Live Data</button>
    </div>

    <script>
        let chartInstance = null;

        function fetchSentimentData() {
            const statusEl = document.getElementById('statusText');
            statusEl.innerText = "Fetching and calculating live market sentiment...";

            fetch('/api/news-sentiment')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to retrieve sentiment data");
                    }
                    return response.json();
                })
                .then(data => {
                    const counts = data.counts;
                    statusEl.innerText = `Successfully analyzed ${data.total_fetched} total articles.`;
                    renderChart(counts);
                })
                .catch(err => {
                    console.error("Error fetching sentiment:", err);
                    statusEl.innerText = "Error fetching news sentiment data. Check server logs.";
                });
        }

        function renderChart(sentimentCounts) {
            const ctx = document.getElementById('marketSentimentChart').getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Bullish', 'Bearish', 'Neutral'],
                    datasets: [{
                        label: 'Number of Articles',
                        data: [
                            sentimentCounts.Bullish || 0,
                            sentimentCounts.Bearish || 0,
                            sentimentCounts.Neutral || 0
                        ],
                        backgroundColor: [
                            '#28a745',  // Green (Bullish)
                            '#dc3545',  // Red (Bearish)
                            '#6c757d'   // Gray (Neutral)
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true,
                            text: 'Market Sentiment'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Number of Articles'
                            },
                            ticks: { precision: 0 }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Sentiment'
                            }
                        }
                    }
                }
            });
        }

        // Fetch metrics automatically when page finishes loading
        document.addEventListener('DOMContentLoaded', fetchSentimentData);
    </script>
</body>
</html>
